<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Titan's Once Human Chat Colorizer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0d0f14;
      --card: #161922;
      --border: #2a2e3a;
      --text: #e8eaed;
      --muted: #9aa0b0;
      --accent: #7c5cff;
      --accent2: #00e5c7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
    }
    header {
      background: #0a0c10;
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }
    .brand span { color: var(--accent); }
    nav {
      display: flex;
      gap: 6px;
      background: #11141c;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    nav button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }
    nav button.active {
      background: var(--accent);
      color: white;
    }
    nav button:hover:not(.active) { color: var(--text); }
    .frame-wrap {
      height: calc(100vh - 64px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg);
    }
    footer {
      position: fixed;
      bottom: 8px;
      right: 12px;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Titan's <span>Once Human</span> Chat Colorizer</div>
    <nav>
      <button data-src="colorizer.html">Colorizer</button>
      <button data-src="invites.html">Isles of Abyss</button>
      <button data-src="resonance.html" class="active">Resonance</button>
    </nav>
  </header>
  <div class="frame-wrap">
    <iframe id="tool" src="resonance.html"></iframe>
  </div>
  <footer>130-char limit enforced · MIT</footer>
  <script>
    const buttons = document.querySelectorAll('nav button');
    const frame = document.getElementById('tool');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        frame.src = btn.dataset.src;
      });
    });
  </script>
</body>
</html>
